<!doctype html>
<html lang="fi">
  <head>
    <script>
      // Over Tailscale, HTTPS is `tailscale serve` on the plain name (port 443). Opening
      // http://<name>.ts.net:5173 hits Vite directly over HTTP, where phones block GPS.
      if (location.protocol === "http:" && location.hostname.endsWith(".ts.net")) {
        location.replace("https://" + location.hostname + location.pathname + location.search + location.hash);
      }
    </script>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: no zooming in when a text field is focused (iOS does that for small text). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Reittiopas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
